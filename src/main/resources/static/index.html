<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring AI Agent Lab · 智能助手</title>
<link rel="stylesheet" href="assets/chat.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">AI</span>
      <div class="brand-text">
        <h1>Spring AI Agent Lab</h1>
        <p>选一个场景，直接对话</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="health" id="health">
        <span class="dot dot-wait"></span>
        <span class="health-text">正在探测后端…</span>
      </div>
      <a class="link-btn" href="swagger-ui.html" target="_blank" rel="noopener">Swagger</a>
      <a class="link-btn" href="v3/api-docs" target="_blank" rel="noopener">OpenAPI</a>
      <a class="link-btn" href="lab.html" title="上一版：逐个接口调试的实验室页面">接口实验室</a>
    </div>
  </header>

  <div class="shell">

    <aside class="rail">
      <div class="rail-title">场景</div>
      <nav class="scene-nav" id="sceneNav"></nav>
      <div class="rail-foot">
        <div class="hint-card">
          <div class="hint-title">每个场景 = 一组接口</div>
          <p>切换场景会换掉背后调用的接口，同时保留各自的对话。</p>
        </div>
        <div class="hint-card">
          <div class="hint-title">同源直连</div>
          <p>页面由 Spring Boot 托管，请求走同源，不需要跨域配置，中文参数也不会被终端转成 GBK。</p>
        </div>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <div class="stage-title">
          <span class="stage-no" id="sceneNo">1</span>
          <div class="stage-title-text">
            <h2 id="sceneName">基础对话</h2>
            <p id="sceneTagline">ChatClient 一问一答</p>
          </div>
        </div>
        <div class="stage-endpoint" id="sceneEndpoint"></div>
      </div>

      <div class="stage-config" id="sceneConfig"></div>

      <div class="chat" id="chat"></div>

      <div class="composer">
        <div class="chips" id="chips"></div>
        <div class="composer-body" id="composerBody"></div>
        <div class="composer-foot" id="composerFoot"></div>
      </div>
    </main>

  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="assets/chat-core.js"></script>
<script src="assets/chat-stages.js"></script>
<script src="assets/chat-app.js"></script>
</body>
</html>
