server:
  port: 8080
  # ===================================================================
  # 全局字符编码 —— 根治接口中文乱码（第一层）
  # ===================================================================
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      # force=true：强制「请求参数」与「响应」都按上面的 charset 处理。
      # 默认 false 时，POST 表单、URL 查询参数在某些容器/场景下仍可能
      # 按 ISO-8859-1 解析，导致中文参数进来就是乱码。
      force: true

spring:
  application:
    name: spring-ai-agent-lab

  # ===================================================================
  # 数据源：Agent 会话记忆落库到本机 MySQL 8.0.28
  #   库 / 表 由 mysql-setup/schema/agent-memory.sql 创建
  #   启动数据库：D:\workspace\mysql-setup\2-start-mysql.cmd
  # ===================================================================
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent_lab?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: agent-lab-pool
      maximum-pool-size: 10
      connection-timeout: 5000

  ai:
    # ===================================================================
    # Stage 1-6：DeepSeek 对话模型
    # ===================================================================
    deepseek:
      # API Key 从环境变量读取，绝不写死在代码或配置文件里
      # （明文写在 yml 里会被 git 跟踪，push 即泄露）
      #   Windows PowerShell :  $env:DEEPSEEK_API_KEY="sk-xxxx"
      #   Windows CMD        :  set DEEPSEEK_API_KEY=sk-xxxx
      #   macOS / Linux      :  export DEEPSEEK_API_KEY=sk-xxxx
      #
      # !!! 请勿把真实 Key 明文写在这里 !!!
      # application.yml 在 git 跟踪范围内，一旦 push 到 GitHub 就等于公开泄露。
      #
      # ⚠️ 空值不会「优雅降级」：DeepSeekChatAutoConfiguration 里对 api-key 做了
      #    Assert.hasText 校验，未设置环境变量时 ChatModel Bean 创建失败，
      #    应用**直接启动不起来**（报 DeepSeek API key must be set），
      #    而不是启动成功、调用时才报 401。所以跑本项目前必须先设好这个变量。
      #    测试类里用假 Key 覆盖，因此 mvn test 不需要真 Key。
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        # 可选值：deepseek-chat / deepseek-reasoner
        model: deepseek-chat
        temperature: 0.7
        # 打开 DeepSeek 思考模式：
        # thinking:
        #   type: enabled

    chat:
      client:
        # =================================================================
        # Stage 6：渐进式工具披露（Progressive Tool Disclosure）
        # 开启后，Spring Boot 自动装配的那个 ChatClient.Builder 会用
        # ToolSearchToolCallingAdvisor 替换默认的 ToolCallingAdvisor。
        # 注意：只影响「注入的 ChatClient.Builder」，Stage 1-5 用
        # ChatClient.builder(chatModel) 手工构建，因此不受影响。
        # =================================================================
        tool-search-advisor:
          enabled: true
          # regex（默认，零额外依赖）/ lucene / vector
          tool-index-type: regex
          # 该 Advisor 按「会话」缓存工具索引，会话标识从请求 context 里取。
          # 默认 key = ChatMemory.CONVERSATION_ID（值为 chat_memory_conversation_id）。
          # 取不到会直接抛 IllegalArgumentException → 接口 500，所以 Controller 必须
          # .advisors(a -> a.param(ChatMemory.CONVERSATION_ID, ...)) 显式塞进去
          # （详见 com.agentlab.stage6.ToolSearchChatController 的类注释）。
          # 想换 key 就打开下面一行，同时改 Controller：
          # session-id-key-name: stage6-session

    # 注意：这里已不再有 spring.ai.chat.memory.repository.jdbc 段落。
    # 持久层换成 MyBatis-Plus 后，ChatMemoryRepository 由
    # com.agentlab.persistence.repository.MybatisChatMemoryRepository 提供，
    # ChatMemory（MessageWindowChatMemory）由 ChatMemoryPersistenceConfig 声明，
    # 官方那套 JDBC 自动配置连同它的配置项一起退场。

    # ===================================================================
    # Stage 7：MCP 客户端，默认关闭
    # 需要体验时把 enabled 改成 true，或使用 mcp profile：
    #   mvn spring-boot:run -Dspring-boot.run.profiles=mcp
    # 详见 application-mcp.yml.example 与 README
    # ===================================================================
    mcp:
      client:
        enabled: false

# =====================================================================
# Stage 8：RAG 知识库（L1 朴素 RAG）
#   装配类：com.agentlab.stage8.config.Stage8RagConfig
#   入口  ：/stage8/kb/**（入库 / 检索 / 统计）、/stage8/chat（带检索的问答）
# =====================================================================
agentlab:
  rag:
    # 总开关。关掉后 Stage 8 的全部 Bean 与接口都不会装配，
    # 用于「模型文件没准备好」或「只想跑 Stage 1~7」时把影响面收敛到零。
    enabled: true

    # 本地 ONNX 嵌入模型目录，目录内需要 tokenizer.json + model.onnx
    # 模型：BAAI/bge-small-zh-v1.5（中文小模型，约 95MB）
    # 之所以用本地目录而不是自动下载：本机实测直连 HuggingFace 仅 ~51KB/s，
    # 95MB 要等近 30 分钟；本地文件是零网络依赖、确定性的。
    # 想换个位置就改环境变量，无需动代码：
    #   Windows CMD : set AGENTLAB_RAG_MODEL_DIR=D:\models\bge-small-zh-v1.5
    model-dir: ${AGENTLAB_RAG_MODEL_DIR:D:/workspace/.toolchain/models/bge-small-zh-v1.5}

    # 单次检索返回的片段数。4 是「够用且不撑爆上下文」的起点。
    top-k: 4
    # 余弦相似度下限，低于它的候选直接丢弃。
    # 想更保守（宁可多给线索）调到 0.3 左右；想更严格调到 0.6。
    similarity-threshold: 0.5

    # 知识库根目录（注意是「目录」，不是文件）。
    # 支持多知识库后，每个库在它下面占一个以自己 id 命名的子目录：
    #   <root>/kb-index.tsv              全部库的元数据（id/名称/备注/创建时间）
    #   <root>/default/store.json        默认库的向量（不带 kbId 的老接口都落在这里）
    #   <root>/default/manifest.tsv      默认库的账本
    #   <root>/kb1/store.json + manifest.tsv
    # 每个库一个目录 = 物理隔离：删库就是删目录，互不干扰，ls 一眼能看清有几个库。
    # 注意：manifest 是权威账本，清单里没有的向量一律不认 —— 否则会出现删不掉的孤儿向量。
    # 旧配置 agentlab.rag.store-path（单文件）已废弃；那份数据会在启动时自动迁移进 default/。
    store-root: ${AGENTLAB_RAG_STORE_ROOT:D:/workspace/.toolchain/rag-store}

    # 启动时预热一次嵌入。首次调用 ONNX 会解压原生库 + 触发 Defender 首扫，
    # 实测 60 秒以上；不预热的话这 60 秒会砸在用户的第一次提问上。
    warmup: true

    # 切块参数（TokenTextSplitter）
    # 注意：这个切块器**没有重叠（overlap）参数** —— 相邻块不共享内容。
    # 关键句正好落在切口上时会被劈成两半，这是 L1 用现成切块器的固有代价，
    # 「自己写一个带重叠的 TextSplitter」是 L2 的第一个升级点。
    chunk-size: 400               # 每块目标 token 上限
    min-chunk-size-chars: 200     # 小于这个字符数的块会被并进相邻块（中文 1 字≈1 字符）
    min-chunk-length-to-embed: 5  # 小于这个字符数的碎片直接丢弃（目录行/孤立标题）

# =====================================================================
# 持久层：MyBatis-Plus（Stage 2 记忆落库）
#   Mapper 接口：com.agentlab.persistence.mapper.ChatMemoryMapper
#   由启动类上的 @MapperScan 扫描注册，无需逐个写 @Mapper
# =====================================================================
mybatis-plus:
  configuration:
    # 下划线列名（conversation_id）自动映射到驼峰属性（conversationId）
    map-underscore-to-camel-case: true
    # 打印执行的 SQL 与参数，学习阶段非常有用（会输出到控制台）。
    # 觉得吵就换成 org.apache.ibatis.logging.nologging.NoLoggingImpl 关闭。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 关掉 MyBatis-Plus 启动时那行 ASCII art banner
    banner: false

# =====================================================================
# Swagger / OpenAPI 文档（springdoc-openapi 3.1.1）
#   可视化界面 : http://localhost:8080/swagger-ui/index.html
#   OpenAPI JSON: http://localhost:8080/v3/api-docs
#   说明        : 由 com.agentlab.config.OpenApiConfig 提供元数据
# =====================================================================
springdoc:
  # 扫描范围：限定在项目包下，避免把 Spring 内部 / 第三方 Controller 也扫进来。
  # 不配的话默认扫描整个 classpath，Actuator 等端点会一起混进文档里。
  packages-to-scan: com.agentlab
  api-docs:
    enabled: true
    path: /v3/api-docs
    # 显式声明 OpenAPI 版本，否则部分客户端（如 Postman 导入）会按 3.0.1 兜底
    version: OPENAPI_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 接口列表按 Tag 名排序。本项目 Tag 形如「Stage 1 · ...」～「Stage 7 · ...」，
    # 数字在前且位数相同，所以 alpha 排出来正好是 1→7；中文 Tag 会排在 ASCII 之后。
    # 注意：一旦出现两位数（Stage 10），alpha 会把它排到 Stage 2 前面，
    # 那时应改用 OpenApiConfig 里声明 tags 的插入顺序（去掉本项）。
    tags-sorter: alpha
    # 同一 Tag 内的方法按 HTTP 语义排序：GET 在前，POST/DELETE 在后
    operations-sorter: method
    # 接口列表默认全展开，减少点击次数
    doc-expansion: list
    # 顶部显示请求耗时 —— 能直观看到「带工具循环的接口就是慢」
    display-request-duration: true
    # 浏览器关闭页面后不残留授权信息（本项目无鉴权，保持 false）
    persist-authorization: false

logging:
  level:
    root: INFO
    com.agentlab: DEBUG
    # 打开后可在控制台看到每次请求的完整 Prompt 与模型响应
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
